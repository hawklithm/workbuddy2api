name: Protocol regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify protocol adapters and safe tool pairing
        run: |
          python -m pytest -q \
            test_anthropic_tool_pairing.py \
            test_responses_tool_pairing.py \
            test_desensitize_claude_harness.py
