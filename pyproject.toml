[project]
name = "workbuddy2api"
version = "2.0.7"
description = "Local OpenAI/Responses/Anthropic compatible proxy for CodeBuddy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx[socks]>=0.25.0",
    "requests>=2.31.0",
    "buddy-agent-auth>=0.1.1,<0.2",
    "daily-checkin[workbuddy]>=0.1.2.dev1,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
workbuddy2api = "codebuddy_proxy.__main__:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebuddy_proxy = ["models_config.*.json", "admin.html", "default_prompt.md"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.uv.sources]
buddy-agent-auth = { path = "../trae2api/dist/buddy_agent_auth-0.1.1-py3-none-any.whl" }
daily-checkin = { path = "../trae2api/dist/daily_checkin-0.1.2.dev1-py3-none-any.whl" }
